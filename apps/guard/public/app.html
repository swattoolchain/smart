<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – Tharam Store Guard</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/" aria-label="Tharam home"><img src="/assets/brand/tharam-logo.svg" width="124" height="36" alt="Tharam"></a>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="root"></main>

<script src="/assets/report.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const root = $('#root');
const esc = escHtml;
let me = null, admin = false, stores = [], current = null, pollTimer = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Request failed'), { status: r.status });
  return j;
}
const host = (u) => { try { return new URL(u).host; } catch { return u; } };
const when = (ts) => ts ? new Date(ts.replace(' ', 'T') + 'Z').toLocaleString() : '–';
const VERD = { healthy: 'Healthy', warning: 'Needs attention', critical: "Customers can't buy", locked: 'Password protected' };

// ---------- Auth ----------
function authView(mode) {
  $('#nav').innerHTML = '<a href="/">Home</a>';
  root.innerHTML = `<div class="auth-box panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${mode === 'login'}" data-m="login">Log in</button>
      <button role="tab" aria-selected="${mode === 'signup'}" data-m="signup">Create account</button>
    </div>
    <form id="auth">
      ${mode === 'signup' ? '<div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name"></div>' : ''}
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}" minlength="8" required>${mode === 'signup' ? '<p class="hint">At least 8 characters</p>' : ''}</div>
      ${mode === 'signup' ? '<div class="field"><label for="storeUrl">Store address (optional)</label><input id="storeUrl" name="storeUrl" placeholder="yourstore.com"></div>' : ''}
      <button class="btn" type="submit" style="width:100%">${mode === 'signup' ? 'Create account' : 'Log in'}</button>
      <p class="error-msg" id="auth-err" role="alert"></p>
    </form></div>`;
  root.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => authView(b.dataset.m));
  $('#auth').onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    try { await api(mode === 'signup' ? '/api/auth/signup' : '/api/auth/login', { method: 'POST', body: fd }); location.hash = ''; boot(); }
    catch (ex) { $('#auth-err').textContent = ex.message; }
  };
}

// ---------- Shell ----------
function shell() {
  $('#nav').innerHTML = `${admin ? '<a href="#/admin">Founder view</a>' : ''}<span class="muted hide-sm">${esc(me.email)}</span><a href="#" id="logout">Log out</a>`;
  $('#logout').onclick = async (e) => { e.preventDefault(); await api('/api/auth/logout', { method: 'POST' }); me = null; authView('login'); };
  root.innerHTML = `<div class="app-layout">
    <aside>
      <h2 style="font-size:1.2rem">Your stores</h2>
      <ul class="store-list" id="stores"></ul>
      <form id="add" class="panel" style="padding:16px">
        <label for="add-url">Add a store</label>
        <input id="add-url" name="url" placeholder="yourstore.com" required>
        <p class="hint">We'll run a full check right away.</p>
        <button class="btn small" type="submit" style="margin-top:8px">Add and test</button>
        <p class="error-msg" id="add-err" role="alert"></p>
      </form>
    </aside>
    <section id="main"></section></div>`;
  $('#add').onsubmit = async (e) => {
    e.preventDefault();
    try { const r = await api('/api/stores', { method: 'POST', body: { url: e.target.url.value } }); e.target.reset(); await loadStores(); select(r.id); }
    catch (ex) { $('#add-err').textContent = ex.message; }
  };
}

function renderStoreList() {
  $('#stores').innerHTML = stores.map((s) => `<li><button data-id="${s.id}" aria-current="${current === s.id}"><span class="host">${esc(s.name || host(s.url))}</span><span class="dot ${esc(s.last_status || '')}" title="${esc(VERD[s.last_status] || 'Not tested yet')}"></span></button></li>`).join('') || '<li class="muted">No stores yet. Add your first store below.</li>';
  $('#stores').querySelectorAll('button').forEach((b) => b.onclick = () => { location.hash = '#/stores/' + b.dataset.id; });
}

async function loadStores() {
  const r = await api('/api/stores');
  stores = r.stores;
  renderStoreList();
}

// ---------- Store detail ----------
async function select(id, runId) {
  current = Number(id);
  renderStoreList();
  clearTimeout(pollTimer);
  const main = $('#main');
  let data;
  try { data = await api(`/api/stores/${id}/runs`); } catch { main.innerHTML = '<div class="panel">Store not found.</div>'; return; }
  const s = data.store;
  const active = data.runs.find((r) => r.status === 'queued' || r.status === 'running');
  const latestDone = data.runs.find((r) => r.status === 'done');
  const showId = runId || (latestDone && latestDone.id);
  main.innerHTML = `
    <div class="toolbar">
      <div><h2 style="margin:0">${esc(s.name || host(s.url))}</h2><span class="muted">${esc(s.url)} · ${s.monitoring ? 'Monitoring on' : 'Monitoring paused'}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small" id="run-full" ${active ? 'disabled' : ''}>${active ? 'Test running…' : 'Run full check'}</button>
        <button class="btn small secondary" id="run-quick" ${active ? 'disabled' : ''}>Quick journey test</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-t="report">Latest report</button>
      <button role="tab" aria-selected="false" data-t="history">History & alerts</button>
      <button role="tab" aria-selected="false" data-t="settings">Settings</button>
    </div>
    <div id="tab"></div>`;
  const tabs = main.querySelectorAll('[data-t]');
  const show = (t) => { tabs.forEach((b) => b.setAttribute('aria-selected', b.dataset.t === t)); ({ report: tabReport, history: tabHistory, settings: tabSettings })[t](); };
  tabs.forEach((b) => b.onclick = () => show(b.dataset.t));

  async function tabReport() {
    const tab = $('#tab');
    if (active && !runId) { tab.innerHTML = waitingHtml(active); }
    else if (!showId) { tab.innerHTML = '<div class="panel"><p>No finished checks yet.</p></div>'; return; }
    if (active && !runId) return;
    const run = await api('/api/runs/' + showId);
    if (!run.result) { tab.innerHTML = `<div class="panel"><h2>Check didn't finish</h2><p>${esc(run.error || '')}</p></div>`; return; }
    const visual = run.result.checks.find((c) => c.id === 'nf.visual' && c.status === 'warn');
    const actions = visual ? `<button class="btn small secondary" id="approve" style="margin-top:12px">Approve current look as the new normal</button>` : '';
    renderReport(tab, run.result, { actions });
    if (visual) $('#approve').onclick = async () => { await api(`/api/stores/${s.id}/approve-visual`, { method: 'POST', body: { runId: run.id } }); $('#approve').textContent = 'Approved'; $('#approve').disabled = true; };
  }
  function tabHistory() {
    $('#tab').innerHTML = `<div class="panel"><h2>Recent checks</h2><table class="runs"><thead><tr><th>When</th><th>Type</th><th>Result</th><th>Score</th></tr></thead><tbody>
      ${data.runs.map((r) => `<tr class="clickable" data-run="${r.id}"><td>${when(r.created_at)}</td><td>${r.kind === 'full' ? 'Full check' : 'Journey test'}</td><td><span class="dot ${esc(r.verdict || '')}" style="display:inline-block;margin-right:6px"></span>${r.status === 'done' ? esc(VERD[r.verdict] || r.verdict) : esc(r.status)}</td><td>${r.score ?? '–'}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="panel"><h2>Alerts sent</h2>${data.alerts.length ? `<table class="runs"><tbody>${data.alerts.map((a) => `<tr><td>${when(a.created_at)}</td><td>${a.state === 'failing' ? '🔴 Broke' : '🟢 Recovered'}</td><td>${esc(a.message || a.check_id)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">No alerts yet. You\'ll be told only when something breaks or recovers.</p>'}</div>`;
    $('#tab').querySelectorAll('[data-run]').forEach((tr) => tr.onclick = () => { location.hash = `#/stores/${s.id}/runs/${tr.dataset.run}`; });
  }
  function tabSettings() {
    $('#tab').innerHTML = `<form class="panel" id="settings">
      <div class="field"><label for="s-name">Store name</label><input id="s-name" name="name" value="${esc(s.name || '')}"></div>
      <div class="field"><label for="s-email">Send alerts to</label><input id="s-email" name="alertEmail" type="email" value="${esc(s.alert_email || '')}"></div>
      <div class="field"><label for="s-slack">Slack webhook (optional)</label><input id="s-slack" name="slack" placeholder="https://hooks.slack.com/services/…" value="${esc(s.slack_webhook || '')}"><p class="hint">Create one in Slack under Apps → Incoming Webhooks.</p></div>
      <div class="field"><label for="s-pass">Storefront password (only if your store is password protected)</label><input id="s-pass" name="password" type="password" autocomplete="off" placeholder="${s.has_password ? 'Saved. Type to replace' : ''}"></div>
      <div class="field"><label style="display:flex;gap:10px;align-items:center;font-weight:600"><input type="checkbox" name="monitoring" style="width:auto" ${s.monitoring ? 'checked' : ''}> Test this store automatically</label></div>
      <button class="btn" type="submit">Save settings</button> <span id="saved" class="muted" role="status"></span>
      <p class="error-msg" id="set-err" role="alert"></p>
      <hr style="border:0;border-top:1px solid var(--line);margin:24px 0">
      <button class="btn danger small" type="button" id="del">Remove this store</button>
    </form>`;
    $('#settings').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const body = { name: f.name.value, alertEmail: f.alertEmail.value, slack: f.slack.value, monitoring: f.monitoring.checked };
      if (f.password.value) body.password = f.password.value;
      try { await api(`/api/stores/${s.id}`, { method: 'PATCH', body }); $('#saved').textContent = 'Saved'; await loadStores(); }
      catch (ex) { $('#set-err').textContent = ex.message; }
    };
    $('#del').onclick = async () => { if (!confirm(`Remove ${host(s.url)} and its history?`)) return; await api(`/api/stores/${s.id}`, { method: 'DELETE' }); current = null; location.hash = ''; await loadStores(); empty(); };
  }

  const trigger = async (kind) => { try { await api(`/api/stores/${s.id}/run`, { method: 'POST', body: { kind } }); select(s.id); } catch (ex) { alert(ex.message); } };
  $('#run-full').onclick = () => trigger('full');
  $('#run-quick').onclick = () => trigger('journeys');
  show('report');
  if (active) pollTimer = setTimeout(async () => { await loadStores(); select(id); }, 4000);
}

function empty() {
  $('#main').innerHTML = `<div class="panel"><h2>Add your first store</h2><p>Enter your store address on the left. Store Guard will learn your products and collections, run a full check, and keep testing every few hours.</p></div>`;
}

// ---------- Founder view ----------
async function adminView() {
  const d = await api('/api/admin/overview');
  const t = (rows, cols) => `<div class="table-scroll"><table class="runs"><thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td>${esc(r[c] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  $('#main').innerHTML = `<div class="cats"><div class="cat"><span>Accounts</span><b>${d.users}</b></div><div class="cat"><span>Stores monitored</span><b>${d.stores}</b></div><div class="cat"><span>Free scans (24h)</span><b>${d.freeScans24h}</b></div><div class="cat"><span>Queue</span><b>${d.queue.active}/${d.queue.waiting}</b></div></div>
    <div class="panel"><h2>Signups</h2>${t(d.signups, ['email', 'name', 'stores', 'created_at'])}</div>
    <div class="panel"><h2>Leads</h2>${t(d.leads, ['email', 'store_url', 'source', 'created_at'])}</div>
    <div class="panel"><h2>Free scans</h2>${t(d.recentScans.map((r) => ({ ...r, report: '/scan/' + r.id })), ['url', 'score', 'verdict', 'status', 'created_at', 'report'])}</div>`;
}

// ---------- Router ----------
async function route() {
  if (!me) return;
  const h = location.hash;
  let m;
  if (h === '#/admin' && admin) return adminView();
  if ((m = /^#\/stores\/(\d+)\/runs\/(\d+)/.exec(h))) return select(m[1], m[2]);
  if ((m = /^#\/stores\/(\d+)/.exec(h))) return select(m[1]);
  if ((m = /^#\/runs\/(\d+)/.exec(h))) {
    const run = await api('/api/runs/' + m[1]).catch(() => null);
    if (run && run.store_id) return select(run.store_id, run.id);
  }
  if (stores[0]) return select(stores[0].id);
  empty();
}

async function boot() {
  try { const r = await api('/api/me'); me = r.user; admin = r.admin; }
  catch { return authView(location.hash === '#signup' ? 'signup' : 'login'); }
  shell();
  await loadStores();
  route();
}
window.addEventListener('hashchange', route);
boot();
</script>
</body>
</html>
